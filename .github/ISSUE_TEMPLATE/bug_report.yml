name: Bug report
description: Report incorrect behavior or a crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Include repro steps and backend/device when possible.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Commands, YAML snippet, backend flags.
      render: bash
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend / device
      placeholder: vulkan / opencl / hip / …
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU, driver, commit SHA.
