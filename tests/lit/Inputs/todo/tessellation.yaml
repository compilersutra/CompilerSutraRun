# Needs tessellation pipeline (tesc/tese stages), not vert+frag only.
name: todo_tessellation
operation: spirv
backend: vulkan
shaders:
  - external/shader-corpus/Vulkan/shaders/glsl/displacement/base.vert
  - external/shader-corpus/Vulkan/shaders/glsl/displacement/displacement.tesc
  - external/shader-corpus/Vulkan/shaders/glsl/displacement/displacement.tese
  - external/shader-corpus/Vulkan/shaders/glsl/displacement/base.frag
execution:
  show: false
  width: 64
  height: 64
  warmup: 0
  iterations: 1
validation:
  enabled: false
